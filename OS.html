<!DOCTYPE html>
<html>
    <body style="user-select: none; background-image: url(images/OS\ wallpaper.jpeg); margin: 0; padding: 0; 
    background-repeat: no-repeat; background-size: auto; overflow:hidden">

        <div id="startWindow" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
         padding: 10px;border-style:solid; border-width:3px; width:fit-content; border-radius: 20px; backdrop-filter: blur(2px);">
            <h1>FactorialOS</h1>
            <p>Operating system project</p>
            <img style="border-radius: 20px; object-fit: cover; width: 500px; height: 300px; border-style:solid; border-width:3px;" src="images/b-787's.jpg" alt="Boeing 787s">
        </div>

        <div style="display: flex; justify-content: space-between; backdrop-filter: blur(5px);">
            <p style="color: rgb(40, 140, 187); margin-left:10px; border-radius: 10px; background-color: rgba(0, 0, 0, 0.7); width: fit-content; padding: 5px;">
                FactorialOS 
            </p>
            <p id="timeDisplay"
             style="color: rgb(40, 140, 187); margin-right:10px; border-radius: 10px; background-color: rgba(0, 0, 0, 0.7); width: fit-content; padding: 5px;">
            </p>
        </div>
        <script src="scripts.js"></script>
    </body>
</html>
